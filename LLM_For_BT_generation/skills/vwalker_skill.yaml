robot:
  earname: "walkerXR-UFES"
  type: "smart_walker_robot"
  description: "Assistive robot focused on helping users with the walking process"

skills:
 
  navigation:
    - id: "move_to"
      name: "Move To Target"
      description: "Navigate to a specific position or object, guiding the user along a planned path"
      parameters:
        target: "string — object name or area"
        arrival_threshold_m: "float — distance in meters to consider arrived (default 0.3)"
      ros2_topics:
        services:
          - name: "/change_navigation_mode"
            values:
              path_creation: 3
              free_navigation: 1
        topics:
          - name: "/odom"
            use: "read robot current position (start point and continuous tracking)"
      preconditions:
        - "target position is known or calculable"
        - "navigation mode set to path_creation (mode=3)"
        - "initial position obtained from /odom"
      execution_monitoring:
        - parameter: "distance_to_target"
          source: "/odom vs target_position"
          trigger: "arrival_threshold_m (0.3m) = transition to SUCCESS"
        - parameter: "obstacle_detected"
          source: "onboard sensors"
          trigger: "true → fallback: replan_route"
      postconditions:
        - "robot is within 0.3m of target"
        - "navigation mode set to free_navigation (mode=1)"
        - "returns SUCCESS"

      failure_modes:
        - "path blocked → fallback: replan_route"
        - "target not found → fallback: scan_environment"
        - "navigation mode change failed → abort and report error"
        
    - id: "stop"
      name: "Safety Stop"
      description: "Halt movement primarily triggered by safety conditions, such as the user removing their hands from the force sensors"
      parameters: {}
      ros2_topics:
        services:
          - name: "/change_navigation_mode"
            values:
              free_navigation: 1
        topics:
          - name: "/cmd_vel"
            use: "publish zero velocities to halt motors"
          - name: "/force_sensors/raw"
            use: "monitor human support to trigger safety stop"
      preconditions:
        - "user support lost (force sensors below safe threshold) OR emergency trigger activated"
      execution_monitoring:
        - parameter: "robot_velocity"
          source: "/odom"
          trigger: "linear == 0 and angular == 0 = transition to SUCCESS"
      postconditions:
        - "robot velocity is zero"
        - "navigation mode set to free_navigation (mode=1)"
      failure_modes:
        - "hardware stop failure → trigger emergency brake exception"

    - id: "replan_route"
      name: "Replan Route"
      description: "Calculate an alternative path using NAV2 when the primary route is blocked, strictly requiring a valid final destination"
      parameters:
        target_destination: "string — mandatory final target object or coordinate"
      ros2_topics:
        services:
          - name: "/change_navigation_mode"
            values:
              path_creation: 3
        topics:
          - name: "/nav2_path"
            use: "re-publish generated path coordinates based on dynamic costmap updates"
      preconditions:
        - "obstacle detected on current path"
        - "target_destination is defined and valid in the map"
        - "navigation mode set to path_creation (mode=3)"
      execution_monitoring:
        - parameter: "path_validity"
          source: "/nav2_path"
          trigger: "valid path array generated to target_destination = transition to SUCCESS"
      postconditions:
        - "new alternative route to the final destination calculated and published"
        - "returns SUCCESS"
      failure_modes:
        - "no viable path found to destination → fallback: scan_environment"

    - id: "scan_environment"
      name: "Scan Environment (Guided Search)"
      description: "Set walker to free navigation mode, allowing the user to walk and guide the camera naturally until the target object is found"
      parameters:
        target_object: "string — the object being searched for"
      ros2_topics:
        services:
          - name: "/change_navigation_mode"
            values:
              free_navigation: 1
        topics:
          - name: "/camera/image_raw"
            use: "continuous visual feed to detect the target while the user moves"
      preconditions:
        - "target object is currently not visible"
      execution_monitoring:
        - parameter: "object_match"
          source: "vision_agent parsing / VLM"
          trigger: "target_object detected in camera frame = transition to SUCCESS"
      postconditions:
        - "object position localized"
        - "returns SUCCESS"
      failure_modes:
        - "user stops searching or timeout reached → transition to FAILURE"

  inspection:
    - id: "detect_object"
      name: "Detect Object"
      description: "Use onboard camera and visual models to find and record a specific target object"
      parameters:
        object_name: "string"
        confidence_threshold: "float — default 0.75"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "image stream input for the vision agent"
      preconditions:
        - "camera frame stream is active"
      execution_monitoring:
        - parameter: "object_match"
          source: "/detected_objects"
          trigger: "label == object_name and confidence >= confidence_threshold = transition to SUCCESS"
      postconditions:
        - "object position and spatial coordinate recorded in runtime memory"
        - "returns SUCCESS"
      failure_modes:
        - "object not detected in current view frame → fallback: reposition_for_view"

    - id: "check_state"
      name: "Check Object State"
      description: "Inspect the specific physical state of an object via camera analysis"
      parameters:
        object_name: "string"
        expected_state: "string — e.g. 'open', 'closed', 'full', 'empty'"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "visual feed for state validation"
      preconditions:
        - "object has been previously detected and localized"
      execution_monitoring:
        - parameter: "visual_state"
          source: "vision_agent parsing"
          trigger: "detected_state == expected_state = transition to SUCCESS"
      postconditions:
        - "object state confirmed or mismatch logged"
        - "returns SUCCESS"
      failure_modes:
        - "state uncertain or unreadable → fallback: reposition_for_view"

    - id: "reposition_for_view"
      name: "Reposition for Better View"
      description: "Adjust walker position slightly to achieve a clearer camera view angle"
      parameters:
        object_name: "string"
        offset_distance: "float — meters, default 0.5"
      ros2_topics:
        services:
          - name: "/change_navigation_mode"
            values:
              path_creation: 3
        topics:
          - name: "/cmd_vel"
            use: "execute small relative repositioning maneuver"
      preconditions:
        - "object initial approximate region is known"
      execution_monitoring:
        - parameter: "displacement"
          source: "/odom"
          trigger: "distance_moved == offset_distance = transition to SUCCESS"
      postconditions:
        - "improved camera vantage point achieved"
        - "returns SUCCESS"
      failure_modes:
        - "reposition path blocked → fallback: stop"

    - id: "check_person_presence"
      name: "Check Person Presence"
      description: "Detect if the human operator is correctly positioned and supported at the walker handles"
      parameters: {}
      ros2_topics:
        topics:
          - name: "/force_sensors/raw"
            use: "read biaxial force inputs from the handles to verify physical user support"
      preconditions: []
      execution_monitoring:
        - parameter: "applied_force"
          source: "/force_sensors/raw"
          trigger: "force_magnitude > interaction_threshold = transition to SUCCESS"
      postconditions:
        - "operator presence and intent confirmed"
        - "returns SUCCESS"
      failure_modes:
        - "no force detected (user left the device) → abort current task and trigger fallback: stop"

 
  human_action_verification:

    - id: "wait_for_human_action"
      name: "Wait for Human Action"
      description: "Prompt the user that a manual action is required and wait for visual confirmation via VLM"
      parameters:
        action_description: "string — instruction for user, e.g., 'abra a porta'"
        timeout_seconds: "float — default 30"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "monitor visual context changes"
      preconditions:
        - "human operator is present and supported (verified via force sensors)"
      execution_monitoring:
        - parameter: "scene_change"
          source: "session_manager VLM loop"
          trigger: "overshoot.result == {flag: true} = transition to SUCCESS"
        - parameter: "elapsed_time"
          source: "system clock"
          trigger: "time > timeout_seconds = transition to FAILURE"
      postconditions:
        - "human action verified as physically completed"
        - "returns SUCCESS"
      failure_modes:
        - "timeout reached → fallback: check_person_presence then retry"
        - "human leaves the walker → fallback: check_person_presence"
 
    - id: "verify_pick_up"
      name: "Verify Pick Up"
      description: "Verify via camera feed that the human has picked up and removed the specific object"
      parameters:
        object_name: "string"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "visual verification of the object's original location"
      preconditions:
        - "object was previously registered at a specific location"
      execution_monitoring:
        - parameter: "object_presence"
          source: "session_manager VLM loop"
          trigger: "overshoot.result (object absent from location) == {flag: true} = transition to SUCCESS"
      postconditions:
        - "object confirmed as successfully removed by user"
        - "returns SUCCESS"
      failure_modes:
        - "object still present after timeout → transition to FAILURE (triggers BT retry/expansion)"
 
    - id: "verify_place"
      name: "Verify Place"
      description: "Verify via camera that the human has placed an object at the target location"
      parameters:
        object_name: "string"
        target_location: "string"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "visual feed of target location"
      preconditions: []
      execution_monitoring:
        - parameter: "object_at_destination"
          source: "session_manager VLM loop"
          trigger: "overshoot.result (object detected at target_location) == {flag: true} = transition to SUCCESS"
      postconditions:
        - "object placement confirmed"
        - "returns SUCCESS"
      failure_modes:
        - "target location empty → transition to FAILURE"
 
    - id: "verify_open"
      name: "Verify Open"
      description: "Verify via camera that the human has opened a door, drawer, or container"
      parameters:
        object_name: "string"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "visual feed of the entity"
      preconditions: []
      execution_monitoring:
        - parameter: "structural_state"
          source: "session_manager VLM loop"
          trigger: "overshoot.result (state == open) == {flag: true} = transition to SUCCESS"
      postconditions:
        - "structural entity confirmed as open"
        - "returns SUCCESS"
      failure_modes:
        - "entity remains closed → fallback: wait_for_human_action"
 
    - id: "verify_close"
      name: "Verify Close"
      description: "Verify via camera that the human has closed a door, drawer, or container"
      parameters:
        object_name: "string"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "visual feed of the entity"
      preconditions: []
      execution_monitoring:
        - parameter: "structural_state"
          source: "session_manager VLM loop"
          trigger: "overshoot.result (state == closed) == {flag: true} = transition to SUCCESS"
      postconditions:
        - "structural entity confirmed as closed"
        - "returns SUCCESS"
      failure_modes:
        - "entity remains open → transition to FAILURE"
 
    - id: "verify_push_pull"
      name: "Verify Push / Pull"
      description: "Verify via camera that the human has pushed or pulled an object to the expected position"
      parameters:
        object_name: "string"
        expected_position: "string — description of expected final position"
      ros2_topics:
        topics:
          - name: "/camera/image_raw"
            use: "visual alignment verification"
      preconditions: []
      execution_monitoring:
        - parameter: "spatial_alignment"
          source: "session_manager VLM loop"
          trigger: "overshoot.result (alignment achieved) == {flag: true} = transition to SUCCESS"
      postconditions:
        - "object confirmed at the expected position"
        - "returns SUCCESS"
      failure_modes:
        - "object misaligned or static → transition to FAILURE"
