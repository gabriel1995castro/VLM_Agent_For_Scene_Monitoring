name : detect_door_status
description: "Uses computer vision  to identify a doorway and its state (open/closed)"
category: perception
outputs:
  - name: clear_to_pass
    type: boolean
    description: "Binary signal for BT: True if navigation can proceed"
  - name: door_status
    type: string 
    description: "Detailed state: 'open', 'closed', 'blocked_by_object'"

failure_modes:
  - sensor_occlusion
  - user_in_the_way
---
name: check_path_clear
description: "Binary check to see if the immediate path is free of obstacles"
category: perception

inputs:
  - name: distance_threshold
    type: float
    description: "Distance in meters to consider path blocked (default: 1.0)"

outputs:
  - name: is_clear
    type: boolean
    description: "True if no obstacle is detected within the threshold"

failure_modes:
  - sensor_timeout
  - blind_spot_detected
---
name: find_object_semantic
description: "Uses VLM to locate a specific object in the camera feed based on natural language description"
category: perception

inputs:
  - name: target_description
    type: string
    description: "Description of the object (e.g., 'blue armchair', 'wooden table')"

outputs:
  - name: found
    type: boolean
  - name: object_pose
    type: geometry_msgs/Pose
    description: "Estimated 3D position of the object for navigation"

failure_modes:
  - object_not_in_view
  - ambiguous_description
  - low_confidence_score
---
name: classify_path_obstruction
description: "Analyzes a detected obstacle to determine if it is a rigid hazard or a traversable/movable object"
category: perception

outputs:
  - name: is_rigid
    type: boolean
    description: "True if the robot must stop; False if it can proceed with caution"
  - name: label
    type: string 

effects:
  - "Updates the local costmap with semantic labels"
---
name: localize_visual_landmark
description: "Identifies specific room features or signs to confirm robot location"
category: perception

inputs:
  - name: landmark_name
    type: string 

outputs:
  - name: landmark_visible
    type: boolean
  - name: estimated_distance
    type: float
---
name: identify_dynamic_intent
description: "Analyzes moving objects (people/pets) in front of the walker to predict collision paths"
category: perception

outputs:
  - name: yield_required
    type: boolean
    description: "True if a person is walking towards the robot and it should slow down"
  - name: social_space_clear
    type: boolean
---
name: detect_path_affordance
description: "Uses the front camera and VLM to evaluate if the floor surface is safe for the walker wheels"
category: perception

outputs:
  - name: is_surface_safe
    type: boolean
    description: "True if floor is flat and free of tripping hazards (rugs, wires, liquid)"
  - name: surface_type
    type: string 

preconditions:
  - "Front camera stream is active"
  - "Lighting conditions > 20 lux"

failure_modes:
  - glares_or_reflections
  - motion_blur